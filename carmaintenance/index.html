<style>
  :root {
    --bg: #f8f9fb;
    --card: #ffffff;
    --text: #1a2433;
    --muted: #5b6b7f;
    --accent: #2f6bff;
    --border: #e3e8ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1b2d;
      --card: #16263c;
      --text: #eef2f7;
      --muted: #9fb0c3;
      --accent: #6b9aff;

    background: var(--bg);
    color: var(--text);
    line-height: 1.9;
    padding: 24px 16px 64px;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  .app-name {
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 32px;
  }
  h2 {
    font-size: 1.15rem;
    margin: 32px 0 8px;
    padding-left: 12px;
    border-left: 4px solid var(--accent);
  }
  p, li { color: var(--muted); }
  ul { padding-left: 24px; }
  strong { color: var(--text); }
  a { color: var(--accent); }
